name: radar-tracker
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.11
  # Core Científico e Geo
  - numpy<2.0
  - scipy
  - matplotlib
  - netcdf4
  - h5py
  - cartopy
  # Visão Computacional e Tracking
  - opencv
  - scikit-image
  - filterpy
  # Pacotes específicos via pip
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch
      - torchvision
      - nexradaws
      - albumentations
      - arm-pyart